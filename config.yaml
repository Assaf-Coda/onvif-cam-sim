listen_ip: 0.0.0.0
advertised_ip: 192.168.1.121
admin_port: 8000
ffmpeg_path: ffmpeg
ffprobe_path: ffprobe
users:
    - name: admin
      password: admin
cameras:
    - name: lobby
      source: ./media/mot20_h264_aac.mp4
      onvif_port: 8081
      rtsp_port: 8554
      manufacturer: SimCam
      model: S-1
      firmware: 1.0.0
      serial: SIM-0001
      motion:
        sensitivity: 0.02
        pixel_threshold: 25
        hold_seconds: 3
        analysis_width: 320
        analysis_fps: 5
        include:
            - - - 0
                - 0
              - - 1
                - 0
              - - 1
                - 1
              - - 0
                - 1
        exclude:
            - - - 0
                - 0
              - - 0.5
                - 0
              - - 0.5
                - 1
              - - 0
                - 1
    - name: yard
      source: ./media/mot20_h265.mov
      onvif_port: 8082
      rtsp_port: 8555
      manufacturer: SimCam
      model: S-1
      firmware: 1.0.0
      serial: SIM-0002
      motion:
        sensitivity: 0.02
        pixel_threshold: 25
        hold_seconds: 3
        analysis_width: 320
        analysis_fps: 5
        include:
            - - - 0
                - 0
              - - 1
                - 0
              - - 1
                - 1
              - - 0
                - 1
        exclude: []
    - name: relay
      source: rtsp://admin:admin@127.0.0.1:8554/stream
      onvif_port: 8083
      rtsp_port: 8556
      manufacturer: SimCam
      model: S-1
      firmware: 1.0.0
      serial: SIM-0003
      motion:
        sensitivity: 0.02
        pixel_threshold: 25
        hold_seconds: 3
        analysis_width: 320
        analysis_fps: 5
        include:
            - - - 0
                - 0
              - - 1
                - 0
              - - 1
                - 1
              - - 0
                - 1
        exclude: []
    - name: synth
      source: ./media/motion_test.mp4
      onvif_port: 8084
      rtsp_port: 8557
      manufacturer: SimCam
      model: S-1
      firmware: 1.0.0
      serial: SIM-0004
      motion:
        sensitivity: 0.02
        pixel_threshold: 25
        hold_seconds: 2
        analysis_width: 320
        analysis_fps: 5
        include:
            - - - 0
                - 0
              - - 1
                - 0
              - - 1
                - 1
              - - 0
                - 1
        exclude: []
