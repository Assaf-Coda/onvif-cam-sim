<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONVIF Camera Simulator</title>
<style>
  :root { --bg:#111; --panel:#1c1c1c; --fg:#e6e6e6; --muted:#8a8a8a; --inc:#3ddc84; --exc:#ff5c5c; --accent:#4ea1ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid #2a2a2a; display:flex; gap:16px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  main { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 45px); }
  aside { background:var(--panel); border-right:1px solid #2a2a2a; padding:8px; }
  .cam { padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .cam:hover { background:#262626; } .cam.sel { background:#2b3a4d; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; display:inline-block; margin-right:6px; }
  .dot.live { background:var(--inc); } .dot.motion { background:#ffc83d; box-shadow:0 0 8px #ffc83d; }
  .small { color:var(--muted); font-size:12px; }
  section { padding:16px; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #3a3a3a; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#333; } button.on { border-color:var(--accent); color:var(--accent); }
  button.inc.on { border-color:var(--inc); color:var(--inc); } button.exc.on { border-color:var(--exc); color:var(--exc); }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); }
  #wrap { position:relative; max-width:960px; background:#000; border:1px solid #2a2a2a; }
  #wrap canvas { width:100%; display:block; cursor:crosshair; }
  #status { margin-top:8px; }
  code { background:#222; padding:1px 5px; border-radius:4px; }
  #addForm { display:none; margin-top:10px; padding:10px; border-top:1px solid #2a2a2a; }
  #addForm.open { display:block; }
  #addForm label { display:block; margin:8px 0 2px; color:var(--muted); font-size:12px; }
  #addForm input[type=text], #addForm input[type=number] { width:100%; background:#111; color:var(--fg); border:1px solid #3a3a3a; border-radius:4px; padding:5px 7px; font:inherit; }
  #addForm input[type=file] { width:100%; font-size:12px; }
  #addForm .row { display:flex; gap:6px; } #addForm .row > * { flex:1; }
  #addForm .kind { display:flex; gap:12px; margin:6px 0; } #addForm .kind label { display:inline; margin:0; color:var(--fg); }
  #addForm .actions { display:flex; gap:6px; margin-top:10px; }
  button.danger { border-color:#7a2e2e; color:var(--exc); }
  #addMsg { margin-top:6px; }
</style>
</head>
<body>
<header><h1>ONVIF Camera Simulator</h1><span class="small" id="hint">Click to add polygon points, double-click to close the polygon. Save writes config.yaml and applies at once.</span></header>
<main>
  <aside>
    <div id="list"></div>
    <div style="padding:8px"><button id="addToggle">Add camera</button></div>
    <form id="addForm">
      <label>Name</label><input type="text" name="name" placeholder="gate" required pattern="[^/ \t?#]+">
      <div class="kind">
        <label><input type="radio" name="kind" value="file" checked> Upload clip</label>
        <label><input type="radio" name="kind" value="rtsp"> RTSP URL</label>
      </div>
      <div id="kindFile"><label>MP4 / MOV file (H.264 or H.265)</label><input type="file" name="file" accept=".mp4,.mov,.m4v,video/mp4,video/quicktime"></div>
      <div id="kindRtsp" style="display:none"><label>RTSP URL (with port)</label><input type="text" name="source" placeholder="rtsp://user:pass@192.168.1.50:554/stream1"></div>
      <div class="row">
        <div><label>ONVIF port</label><input type="number" name="onvif_port" placeholder="auto" min="1" max="32767"></div>
        <div><label>RTSP port</label><input type="number" name="rtsp_port" placeholder="auto" min="1" max="32767"></div>
      </div>
      <div class="row">
        <div><label>HTTPS</label><label style="display:flex;align-items:center;gap:6px;color:var(--fg);margin:4px 0"><input type="checkbox" name="https" checked> enabled</label></div>
        <div><label>HTTPS port</label><input type="number" name="onvif_https_port" placeholder="ONVIF port + 1000" min="1" max="32767"></div>
      </div>
      <div class="row">
        <div><label>Manufacturer</label><input type="text" name="manufacturer" placeholder="SimCam"></div>
        <div><label>Model</label><input type="text" name="model" placeholder="S-1"></div>
      </div>
      <div class="actions"><button type="submit" class="primary" id="addSubmit">Add</button><button type="button" id="addCancel">Cancel</button></div>
      <div id="addMsg" class="small"></div>
    </form>
  </aside>
  <section>
    <div class="toolbar">
      <button id="modeInc" class="inc on">Draw include zone</button>
      <button id="modeExc" class="exc">Draw exclude zone</button>
      <button id="undo">Undo point</button>
      <button id="clear">Clear all zones</button>
      <button id="save" class="primary">Save</button>
      <button id="remove" class="danger">Remove camera</button>
      <span id="msg" class="small"></span>
    </div>
    <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
    <div id="status" class="small"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let cams = [], sel = null, zones = {include:[], exclude:[]}, draft = [], mode = 'include', img = new Image(), dirty = false;
const cv = $('#c'), ctx = cv.getContext('2d');

async function refresh() {
  const r = await fetch('/api/cameras'); if (!r.ok) return;
  cams = await r.json();
  if (sel && !cams.find(x => x.name === sel)) sel = null;
  if (!sel && cams.length) select(cams[0].name, true);
  renderList();
  const c = cams.find(x => x.name === sel);
  if (!c) { $('#status').innerHTML = cams.length ? '' : 'No cameras yet. Use Add camera.'; draw(); return; }
  const https = c.onvif_https_port > 0 ? ` &nbsp; HTTPS <code>https://${location.hostname}:${c.onvif_https_port}/onvif/device_service</code>` : ' &nbsp; HTTPS off';
  $('#status').innerHTML =
    `<b>${c.name}</b> &nbsp; ${c.codec} ${c.width}x${c.height} &nbsp; ONVIF <code>http://${location.hostname}:${c.onvif_port}/onvif/device_service</code>${https} &nbsp; RTSP <code>rtsp://${location.hostname}:${c.rtsp_port}/stream</code>` +
    `<br>motion: <b>${c.motion ? 'ACTIVE' : 'idle'}</b> (changed ${(c.motion_ratio*100).toFixed(2)}%, trigger ${(c.settings.sensitivity*100).toFixed(2)}%, hold ${c.settings.hold_seconds}s) &nbsp; stream ${c.live ? 'live' : 'down'}, ${c.readers} reader(s)`;
}
function renderList() {
  $('#list').innerHTML = cams.map(c => `<div class="cam ${c.name===sel?'sel':''}" data-n="${c.name}">
    <span><span class="dot ${c.motion?'motion':(c.live?'live':'')}"></span>${c.name}</span><span class="small">${c.motion?'motion':''}</span></div>`).join('');
  document.querySelectorAll('.cam').forEach(el => el.onclick = () => select(el.dataset.n));
}
function select(name, force) {
  if (!force && dirty && !confirm('Discard unsaved zone changes?')) return;
  sel = name; dirty = false; draft = [];
  const c = cams.find(x => x.name === name);
  zones = {include: c.zones.include.map(p => p.slice()), exclude: c.zones.exclude.map(p => p.slice())};
  renderList(); loadImg(); draw();
}
function loadImg() { if (!sel) return; const i = new Image(); i.onload = () => { img = i; draw(); }; i.src = `/api/cameras/${sel}/snapshot.jpg?t=${Date.now()}`; }
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (img.width) ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const poly = (pts, color, close, fill) => {
    if (!pts.length) return; ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0]*cv.width, p[1]*cv.height) : ctx.moveTo(p[0]*cv.width, p[1]*cv.height));
    if (close) ctx.closePath();
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
    if (fill) { ctx.fillStyle = color + '33'; ctx.fill(); }
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0]*cv.width, p[1]*cv.height, 4, 0, 7); ctx.fillStyle = color; ctx.fill(); });
  };
  zones.include.forEach(z => poly(z, '#3ddc84', true, true));
  zones.exclude.forEach(z => poly(z, '#ff5c5c', true, true));
  poly(draft, mode === 'include' ? '#3ddc84' : '#ff5c5c', false, false);
}
function pt(e) { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX-r.left)/r.width)), Math.min(1, Math.max(0, (e.clientY-r.top)/r.height))]; }
cv.onclick = e => { if (e.detail > 1) return; draft.push(pt(e).map(v => +v.toFixed(4))); draw(); };
cv.ondblclick = e => { e.preventDefault(); if (draft.length >= 3) { zones[mode].push(draft); dirty = true; } draft = []; draw(); };
$('#modeInc').onclick = () => { mode = 'include'; draft = []; $('#modeInc').classList.add('on'); $('#modeExc').classList.remove('on'); draw(); };
$('#modeExc').onclick = () => { mode = 'exclude'; draft = []; $('#modeExc').classList.add('on'); $('#modeInc').classList.remove('on'); draw(); };
$('#undo').onclick = () => { if (draft.length) draft.pop(); else { zones[mode].pop(); dirty = true; } draw(); };
$('#clear').onclick = () => { zones = {include:[], exclude:[]}; draft = []; dirty = true; draw(); };
$('#save').onclick = async () => {
  const r = await fetch(`/api/cameras/${sel}/zones`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(zones)});
  $('#msg').textContent = r.ok ? 'Saved to config.yaml' : 'Save failed: ' + await r.text();
  if (r.ok) { dirty = false; await refresh(); select(sel, true); }
  setTimeout(() => $('#msg').textContent = '', 4000);
};
$('#remove').onclick = async () => {
  if (!sel || !confirm(`Remove camera "${sel}"? Its uploaded clip (if any) is deleted too.`)) return;
  const r = await fetch(`/api/cameras/${sel}`, {method:'DELETE'});
  $('#msg').textContent = r.ok ? 'Camera removed' : 'Remove failed: ' + await r.text();
  if (r.ok) { sel = null; dirty = false; img = new Image(); await refresh(); }
  setTimeout(() => $('#msg').textContent = '', 4000);
};
const form = $('#addForm');
$('#addToggle').onclick = () => form.classList.toggle('open');
$('#addCancel').onclick = () => { form.classList.remove('open'); form.reset(); $('#addMsg').textContent = ''; };
form.https.onchange = () => { form.onvif_https_port.disabled = !form.https.checked; };
form.querySelectorAll('input[name=kind]').forEach(el => el.onchange = () => {
  const file = form.kind.value === 'file';
  $('#kindFile').style.display = file ? '' : 'none'; $('#kindRtsp').style.display = file ? 'none' : '';
});
form.onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData();
  for (const k of ['name','onvif_port','rtsp_port','manufacturer','model']) if (form[k].value) fd.append(k, form[k].value);
  if (!form.https.checked) fd.append('onvif_https_port', '0');
  else if (form.onvif_https_port.value) fd.append('onvif_https_port', form.onvif_https_port.value);
  if (form.kind.value === 'rtsp') {
    if (!form.source.value) { $('#addMsg').textContent = 'RTSP URL is required'; return; }
    fd.append('source', form.source.value);
  } else {
    if (!form.file.files.length) { $('#addMsg').textContent = 'Choose a file'; return; }
    fd.append('file', form.file.files[0]);
  }
  $('#addSubmit').disabled = true; $('#addMsg').textContent = form.kind.value === 'file' ? 'Uploading and probing...' : 'Probing...';
  const r = await fetch('/api/cameras', {method:'POST', body: fd});
  $('#addSubmit').disabled = false;
  if (!r.ok) { $('#addMsg').textContent = 'Failed: ' + await r.text(); return; }
  const c = await r.json();
  $('#addMsg').textContent = ''; form.reset(); form.classList.remove('open');
  await refresh(); select(c.name, true);
};
refresh(); setInterval(refresh, 1000); setInterval(loadImg, 2000);
</script>
</body>
</html>
